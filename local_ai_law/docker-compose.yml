services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  app:
    build: .
    container_name: rag-studio
    ports:
      - "${RAG_PORT:-8000}:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - RAG_HOST=0.0.0.0
      - RAG_PORT=8000
      # Names the firm types to reach the box (comma separated). Loopback, a bare IP and
      # the hostname always work; any other Host gets a 400 (services/guard.py).
      - PDM_HOSTS=${PDM_HOSTS:-}
      # All mutable state lives on the /app/data volume (users, audit, settings) —
      # matches the appliance contract, so nothing persists inside the image layer.
      - RAG_DATA_DIR=/app/data
      - RAG_USERS_FILE=/app/data/users.json
      - RAG_AUDIT_LOG=/app/data/audit.log
      - RAG_SETTINGS_FILE=/app/data/settings.json
      - RAG_JWT_SECRET_FILE=/app/data/.jwt_secret
      - RAG_MAX_UPLOAD_MB=${RAG_MAX_UPLOAD_MB:-50}
      - RAG_LOG_LEVEL=${RAG_LOG_LEVEL:-INFO}
      - RAG_BACKUP_INTERVAL_HOURS=${RAG_BACKUP_INTERVAL_HOURS:-24}
      - RAG_BACKUP_KEEP_COUNT=${RAG_BACKUP_KEEP_COUNT:-7}
      - RAG_APP_NAME=${RAG_APP_NAME:-RAG Studio}
      - RAG_PRIMARY_COLOR=${RAG_PRIMARY_COLOR:-#6366f1}
      - RAG_MAX_OLLAMA_NUM_CTX=${RAG_MAX_OLLAMA_NUM_CTX:-8192}
      - RAG_OLLAMA_CHAT_CONCURRENCY=${RAG_OLLAMA_CHAT_CONCURRENCY:-1}
      - RAG_CRITICAL_WORKERS=${RAG_CRITICAL_WORKERS:-1}
      - RAG_LOW_WORKERS=${RAG_LOW_WORKERS:-1}
      - RAG_EMBED_BATCH_SIZE=${RAG_EMBED_BATCH_SIZE:-32}
      - RAG_AUTO_STUDY_PIPELINE=${RAG_AUTO_STUDY_PIPELINE:-false}
      - RAG_AUTO_WIKI_BUILD=${RAG_AUTO_WIKI_BUILD:-false}
      - RAG_AUTO_GRAPH_BUILD=${RAG_AUTO_GRAPH_BUILD:-false}
      - RAG_AUTO_CONTRADICTIONS=${RAG_AUTO_CONTRADICTIONS:-false}
    volumes:
      # One volume holds everything mutable — users.json, audit.log, settings.json all
      # resolve under here via the RAG_* env above (no brittle per-file bind mounts,
      # which Docker silently turns into directories when the host file is absent).
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - ollama
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - https

volumes:
  ollama_data:
